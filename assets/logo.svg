<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" class="jh-emblem-svg" width="200" height="240" fill="none">
  <defs>
    <!-- Ultra-Luxe 24K Gold Metallic Gradient -->
    <linearGradient id="jhGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="20%" stop-color="#F5D061" />
      <stop offset="45%" stop-color="#E5B83B" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="90%" stop-color="#8E6510" />
      <stop offset="100%" stop-color="#5C3E00" />
    </linearGradient>

    <!-- Polished Platinum Chrome Gradient -->
    <linearGradient id="jhPlatinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Subtle Bevel & Ambient Aura Filter -->
    <filter id="jhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <polygon
    points="100,18 184,66 184,174 100,222 16,174 16,66"
    stroke="url(#jhGoldGrad)"
    stroke-width="13"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="#07080E"
    filter="url(#jhGlow)"
  />

  <!-- Inner Delicate Golden Inset Rim -->
  <polygon
    points="100,30 172,72 172,168 100,210 28,168 28,72"
    stroke="rgba(245, 208, 97, 0.28)"
    stroke-width="1.5"
    fill="none"
  />

  <!-- Interlocking Monogram: 'J' in 24K Brushed Gold -->
  <path
    d="M 64,88 L 94,62 L 94,176 L 38,176 L 38,130 L 52,130 L 52,160 L 78,160 L 78,96 L 64,106 Z"
    fill="url(#jhGoldGrad)"
  />

  <!-- Interlocking Monogram: 'H' in Polished Platinum Chrome -->
  <path
    d="M 104,62 L 120,62 L 120,114 L 148,114 L 148,84 L 164,94 L 164,146 L 148,156 L 148,128 L 120,128 L 120,176 L 104,176 Z"
    fill="url(#jhPlatinumGrad)"
  />
</svg>